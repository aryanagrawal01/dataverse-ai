# Render Blueprint — provisions the web service and its Postgres database
# together. In the Render dashboard: New -> Blueprint -> select this repo.
# Render reads this file and creates everything below in one step.
#
# OPENAI_API_KEY is intentionally left for you to fill in after deploy
# (Render will prompt for it since sync: false) — the app runs fully
# without it, with AI features in degraded/template mode.
#
# NOTE: no persistent disk on the free plan (Render doesn't support disks on
# free web services), so uploaded datasets and generated reports live only
# on the container's ephemeral filesystem and are lost on redeploy/restart.
# Fine for a demo; upgrade the web service plan and add a `disk:` block back
# for real persistence, or point STORAGE_BACKEND at S3-compatible storage.

services:
  - type: web
    name: dataverse-ai
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dataverse-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /app/data/artifacts
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: USER_QUOTA_MB
        value: "500"
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BUDGET_USD_PER_PROJECT
        value: "0.25"
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: dataverse-db
    plan: free
    databaseName: dataverse
    user: dataverse
