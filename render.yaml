# Render Blueprint — provisions the dataverse-ai web service. In the Render
# dashboard: New -> Blueprint -> select this repo. Render reads this file
# and creates everything below in one step.
#
# OPENAI_API_KEY is intentionally left for you to fill in after deploy
# (Render will prompt for it since sync: false) — the app runs fully
# without it, with AI features in degraded/template mode. LLM_BASE_URL
# points this at Groq's OpenAI-compatible endpoint instead of api.openai.com
# (see config/settings.py + llm/openai_provider.py) — paste a Groq key
# (starts gsk_...) into OPENAI_API_KEY, not an actual OpenAI key, to match.
#
# DELIBERATELY NO POSTGRES DATABASE HERE: Render's free plan allows only one
# free Postgres instance per account, and provisioning a second one hangs
# the blueprint sync with no clear error rather than failing fast. This
# deployment runs on SQLite instead (ENVIRONMENT=staging, since the app's
# own prod-mode validation intentionally refuses SQLite in prod — see
# config/settings.py validate_for_environment()).
#
# NOTE: no persistent disk on the free plan either (Render doesn't support
# disks on free web services), so the SQLite file, uploaded datasets, and
# generated reports all live on the container's ephemeral filesystem and
# are lost on redeploy/restart. Fine for a demo; for real persistence,
# upgrade the plan and add both a `disk:` block and a `databases:` section
# back with Postgres, or point STORAGE_BACKEND at S3-compatible storage.

services:
  - type: web
    name: dataverse-ai
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/data/dataverse.db
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /app/data/artifacts
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: USER_QUOTA_MB
        value: "500"
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_BUDGET_USD_PER_PROJECT
        value: "0.25"
      - key: OPENAI_API_KEY
        sync: false
